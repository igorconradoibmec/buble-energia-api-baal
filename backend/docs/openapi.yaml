openapi: 3.0.3
info:
  title: Bulbe Energia API
  version: 0.1.0
  description: |
    Backend da loja Bulbe Energia.

    Catálogo de produtos, carrinho e checkout. Persistência em arquivos JSON
    (`src/data/`) — projeto acadêmico.

    ## Autenticação

    Endpoints de carrinho e pedido exigem header `Authorization: Bearer <token>`.
    O middleware (`src/middlewares/auth.middleware.js`) trata qualquer string não vazia
    como `userId` — útil para isolar carrinhos por usuário sem implementar JWT.

servers:
  - url: /api/v1
    description: Base da API

tags:
  - name: Products
    description: Catálogo de produtos
  - name: Cart
    description: Carrinho do usuário (autenticado)
  - name: Orders
    description: Finalização de compra
  - name: Customers
    description: Dados e pedidos do cliente
  - name: Coupons
    description: Validação de cupons de desconto
  - name: Users
    description: Sessão de usuário
  - name: Auth
    description: Autenticação via JWT

paths:
  /products:
    get:
      tags: [Products]
      summary: Lista produtos do catálogo
      description: |
        Retorna todos os produtos. Aceita filtro opcional por categoria
        (case-insensitive, comparação exata após `trim().toLowerCase()`).
      parameters:
        - in: query
          name: category
          required: false
          schema:
            type: string
          example: "Conforto e bem-estar no lar"
      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: object
                required: [products, total]
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  total:
                    type: integer
                    example: 42

  /products/search:
    get:
      tags: [Products]
      summary: Busca produtos por texto livre
      description: |
        Busca case-insensitive em `name`, `description` e `category`.
        Query vazia retorna lista vazia (não retorna todos).
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          example: alexa
      responses:
        '200':
          description: Resultados da busca
          content:
            application/json:
              schema:
                type: object
                required: [query, results, total]
                properties:
                  query:
                    type: string
                    example: alexa
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  total:
                    type: integer

  /products/featured:
    get:
      tags: [Products]
      summary: Produtos em destaque
      description: |
        Retorna até 8 produtos em destaque, garantindo no mínimo 2 produtos
        Alexa (matched por `alexa` ou `echo` em name/description/category)
        no início da lista.
      responses:
        '200':
          description: Produtos em destaque
          content:
            application/json:
              schema:
                type: object
                required: [products, total]
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  total:
                    type: integer
                    example: 8

  /products/black-friday:
    servers:
      - url: http://localhost:3002/api/v1
        description: Serviço isolado da Black Friday (porta dedicada)
    get:
      tags: [Products]
      summary: Produtos da campanha Black Friday
      description: |
        Retorna os produtos selecionados para a campanha Black Friday.

        Esta rota roda num serviço isolado, em porta própria (`BLACK_FRIDAY_PORT`,
        padrão `3002`), separado da API principal (`PORT`, padrão `3001`). O pico
        de tráfego da campanha fica contido no seu próprio processo e não derruba
        o catálogo, o carrinho nem o checkout (padrão *bulkhead*).

        Suporta filtros opcionais por categoria, faixa de preço e avaliação mínima.
      parameters:
        - in: query
          name: category
          required: false
          schema:
            type: string
          example: Conforto
        - in: query
          name: priceRange
          required: false
          schema:
            type: string
            enum: [all, 0-50, 50-100, 100-300, 300-999]
          example: 300-999
        - in: query
          name: minRating
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 5
          example: 4
      responses:
        '200':
          description: Produtos da campanha Black Friday filtrados
          content:
            application/json:
              schema:
                type: object
                required: [products, filters, total]
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  filters:
                    type: object
                    required: [categories, priceRanges]
                    properties:
                      categories:
                        type: array
                        items:
                          type: string
                      priceRanges:
                        type: array
                        items:
                          type: string
                          enum: [0-50, 50-100, 100-300, 300-999]
                  total:
                    type: integer
                    example: 4
        '400':
          description: priceRange inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/recommendations:
    get:
      tags: [Products]
      summary: Recomendações de produtos baseadas no carrinho
      description: |
        Recebe IDs dos itens do carrinho e retorna até 10 produtos por categoria
        compartilhada com os itens, excluindo os que já estão no carrinho.
      parameters:
        - in: query
          name: cartItemIds
          required: false
          description: Lista de IDs separados por vírgula (ex `1,3,5`)
          schema:
            type: string
          example: "1,3,5"
      responses:
        '200':
          description: Lista de produtos recomendados
          content:
            application/json:
              schema:
                type: object
                required: [recommendations, total]
                properties:
                  recommendations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  total:
                    type: integer
                    example: 7

  /products/{id}:
    get:
      tags: [Products]
      summary: Busca produto por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        '200':
          description: Produto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Produto não existe ou ID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cart:
    get:
      tags: [Cart]
      summary: Obtém o carrinho do usuário autenticado
      description: |
        Retorna os itens do carrinho do usuário, com `itemCount` e `total` calculados.
        Carrinho vazio retorna `items: []` com `itemCount` e `total` zerados.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Carrinho do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Cart]
      summary: Limpa o carrinho do usuário
      description: Remove todos os itens do carrinho. Idempotente — sucesso mesmo se já estava vazio.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Carrinho limpo
          content:
            application/json:
              schema:
                type: object
                required: [message, cart]
                properties:
                  message:
                    type: string
                    example: Carrinho limpo
                  cart:
                    $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /cart/items:
    post:
      tags: [Cart]
      summary: Adiciona um produto ao carrinho
      description: |
        Adiciona um produto ao carrinho do usuário autenticado. Se o produto
        já existir no carrinho, soma a quantidade (limite máximo de 99).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId:
                  type: integer
                  minimum: 1
                  example: 1
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 99
                  example: 1
      responses:
        '201':
          description: Item adicionado ao carrinho
          content:
            application/json:
              schema:
                type: object
                required: [message, cart]
                properties:
                  message:
                    type: string
                    example: Item adicionado ao carrinho
                  cart:
                    $ref: '#/components/schemas/Cart'
        '400':
          description: Body inválido (productId ou quantity ausentes/inválidos, ou produto inexistente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /cart/items/{itemId}:
    parameters:
      - in: path
        name: itemId
        required: true
        schema:
          type: integer
          minimum: 1
        description: ID do item no carrinho (mesmo ID do produto)
        example: 1
    put:
      tags: [Cart]
      summary: Atualiza quantidade de um item
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 99
                  example: 3
      responses:
        '200':
          description: Quantidade atualizada
          content:
            application/json:
              schema:
                type: object
                required: [message, cart]
                properties:
                  message:
                    type: string
                    example: Quantidade atualizada
                  cart:
                    $ref: '#/components/schemas/Cart'
        '400':
          description: Quantidade inválida (fora do range 1-99 ou não-inteiro)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Item não está no carrinho
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Cart]
      summary: Remove um item do carrinho
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Item removido
          content:
            application/json:
              schema:
                type: object
                required: [message, cart]
                properties:
                  message:
                    type: string
                    example: Item removido do carrinho
                  cart:
                    $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Item não está no carrinho
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Autentica usuário e retorna JWT
      description: |
        Valida email e senha contra os usuários mockados em `src/data/usuarios.js`.
        Em caso de sucesso, retorna um JWT assinado para uso como
        `Authorization: Bearer <token>` nas rotas protegidas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@bulbe.com
                senha:
                  type: string
                  format: password
                  example: admin123
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresIn, usuario]
                properties:
                  token:
                    type: string
                    description: JWT assinado a ser enviado como Bearer token
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  expiresIn:
                    type: string
                    example: 1h
                  usuario:
                    type: object
                    required: [id, nome, email, role]
                    properties:
                      id:
                        type: integer
                        example: 1
                      nome:
                        type: string
                        example: Administrador
                      email:
                        type: string
                        format: email
                        example: admin@bulbe.com
                      role:
                        type: string
                        example: admin
        '400':
          description: Email ou senha não informados
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Informe email e senha
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Credenciais invalidas

  /users:
    post:
      tags: [Users]
      summary: Cria uma sessão de usuário guest
      description: |
        Gera um ID de usuário anônimo (`guest-XXXXXX`) e retorna o token
        a ser usado como Bearer nas rotas autenticadas.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Sessão criada com sucesso
          content:
            application/json:
              schema:
                type: object
                required: [userId, token, createdAt]
                properties:
                  userId:
                    type: string
                    example: guest-a1b2c3
                  token:
                    type: string
                    description: Mesmo valor que userId — usar como Bearer token
                    example: guest-a1b2c3
                  createdAt:
                    type: string
                    format: date-time

  /coupons/validate:
    post:
      tags: [Coupons]
      summary: Valida um cupom de desconto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  example: BULBE10
      responses:
        '200':
          description: Resultado da validação (válido ou inválido)
          content:
            application/json:
              schema:
                type: object
                required: [valid, message]
                properties:
                  valid:
                    type: boolean
                  code:
                    type: string
                    example: BULBE10
                  discountPercentage:
                    type: number
                    format: float
                    description: Presente apenas quando valid=true
                    example: 0.10
                  message:
                    type: string
                    example: Cupom aplicado com sucesso! Desconto de 10%

  /customers/{customerId}/orders:
    get:
      tags: [Customers]
      summary: Lista pedidos do usuário
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: customerId
          required: true
          schema:
            type: string
          example: guest-a1b2c3
      responses:
        '200':
          description: Lista de pedidos do cliente
          content:
            application/json:
              schema:
                type: object
                required: [orders, total]
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  total:
                    type: integer
                    example: 3
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Busca detalhes de um pedido
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
          example: ord-3f9a1b2c
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Pedido não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders:
    post:
      tags: [Orders]
      summary: Finaliza uma compra
      description: |
        Cria um pedido a partir do payload. Regras de desconto:

        - Pagamento `pix` → 10% de desconto automático
        - `couponCode` válido → desconto adicional do cupom (se ambos, somam-se sobre o subtotal)
        - Cupons válidos: `BULBE10` (10%), `BULBE15` (15%), `BULBE20` (20%),
          `BLACKFRIDAY` (20%), `WELCOME5` (5%), `PROMO25` (25%), `SUPERPROMO` (40%)

        `orderCode` segue o formato `PD-YYYYMMDD-HHMMSS-{firstItemId}x{firstItemQty}`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Pedido criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Body inválido (ver mensagem)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bodyInvalido:
                  value: { error: "Body invalido" }
                semItens:
                  value: { error: "Items obrigatorio" }
                pagamento:
                  value: { error: "Metodo de pagamento invalido" }
                cupom:
                  value: { error: "Cupom invalido" }
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Qualquer string não vazia é tratada como `userId`. Não é JWT.

  responses:
    Unauthorized:
      description: Token Bearer ausente ou malformado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example: { error: "Nao autenticado" }

  schemas:
    Product:
      type: object
      required: [id, name, price]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Echo Dot 5ª Geração
        description:
          type: string
          example: O Echo Dot com o melhor som já lançado Cor Preta.
        category:
          type: string
          example: Conforto e bem-estar no lar
        price:
          type: number
          format: float
          example: 398.99
        oldPrice:
          type: number
          format: float
          example: 459
        discount:
          type: integer
          description: Percentual de desconto em relação ao oldPrice
          example: 13
        rating:
          type: number
          format: float
          minimum: 0
          maximum: 5
          example: 5
        ratingCount:
          type: integer
          example: 439
        image:
          type: string
          example: images/produtos/echoDot.jpg

    CartItem:
      type: object
      required: [id, quantity, price]
      properties:
        id:
          type: integer
          description: Mesmo ID do produto
          example: 1
        name:
          type: string
          example: Echo Dot 5ª Geração
        price:
          type: number
          format: float
          example: 398.99
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          example: 2
        image:
          type: string
          example: images/produtos/echoDot.jpg

    Cart:
      type: object
      required: [items, itemCount, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        itemCount:
          type: integer
          description: Soma de quantity de todos os items
          example: 3
        total:
          type: number
          format: float
          description: Soma de price * quantity (2 casas decimais)
          example: 1196.97

    Address:
      type: object
      required: [zip, street, number, city, state]
      properties:
        zip:
          type: string
          example: "30130-100"
        street:
          type: string
          example: Av. Afonso Pena
        number:
          type: string
          example: "1500"
        complement:
          type: string
          example: Apt 502
        neighborhood:
          type: string
          example: Centro
        city:
          type: string
          example: Belo Horizonte
        state:
          type: string
          example: MG

    Customer:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          example: Joshua Azze
        email:
          type: string
          format: email
          example: jazzedistel@gmail.com
        phone:
          type: string
          example: "(31) 99999-9999"
        cpf:
          type: string
          example: "000.000.000-00"

    OrderRequest:
      type: object
      required: [items, paymentMethod, shipping, customer, billingAddress, deliveryAddress]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, quantity, price]
            properties:
              id:
                type: integer
                minimum: 1
              quantity:
                type: integer
                minimum: 1
              price:
                type: number
                format: float
                minimum: 0
        paymentMethod:
          type: string
          enum: [credit-card, pix, boleto]
        shipping:
          type: number
          format: float
          minimum: 0
        customer:
          $ref: '#/components/schemas/Customer'
        billingAddress:
          $ref: '#/components/schemas/Address'
        deliveryAddress:
          $ref: '#/components/schemas/Address'
        couponCode:
          type: string
          nullable: true
          description: Código do cupom (case-insensitive, normalizado pra UPPERCASE)
          example: BULBE10

    Order:
      type: object
      required: [id, orderCode, customerId, items, paymentMethod, subtotal, shipping, total, finalAmount, createdAt]
      properties:
        id:
          type: string
          example: ord-3f9a1b2c
        orderCode:
          type: string
          description: Formato `PD-YYYYMMDD-HHMMSS-{firstItemId}x{firstItemQty}`
          example: PD-20260504-184230-1x2
        customerId:
          type: string
          description: userId do Bearer token
          example: user-123
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              quantity: { type: integer }
              price: { type: number, format: float }
        paymentMethod:
          type: string
          enum: [credit-card, pix, boleto]
        customer:
          $ref: '#/components/schemas/Customer'
        billingAddress:
          $ref: '#/components/schemas/Address'
        deliveryAddress:
          $ref: '#/components/schemas/Address'
        couponCode:
          type: string
          nullable: true
        subtotal:
          type: number
          format: float
          description: Soma de price * quantity dos items (sem frete, sem desconto)
        shipping:
          type: number
          format: float
        couponDiscount:
          type: number
          format: float
          description: Fração de desconto do cupom (ex 0.10 = 10%)
          example: 0.10
        pixDiscount:
          type: number
          format: float
          description: 0.10 se paymentMethod=pix, senão 0
          example: 0.10
        total:
          type: number
          format: float
          description: subtotal + shipping (antes dos descontos)
        finalAmount:
          type: number
          format: float
          description: subtotal - (subtotal * (couponDiscount + pixDiscount)) + shipping
        createdAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Mensagem de erro
